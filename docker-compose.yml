services:
  subhub:
    build: .
    image: ghcr.io/monlor/subhub:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "${PORT:-3000}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY before starting subhub}"
      PROXY_SUBS: "${PROXY_SUBS:?Set PROXY_SUBS before starting subhub}"
      RELAY_SUBS: "${RELAY_SUBS:-}"
      SURGE_INTERFACE: "${SURGE_INTERFACE:-}"
      LOON_RELAY_INCLUDE_REGEX: "${LOON_RELAY_INCLUDE_REGEX-(^|[^0-9.])1([.]0)?[x×](?![0-9a-z.])}"
      LOON_RELAY_EXCLUDE_REGEX: "${LOON_RELAY_EXCLUDE_REGEX-家宽|住宅|HOME}"
      SUB_CACHE_TTL: "${SUB_CACHE_TTL:-3600}"
      CACHE_DIR: "${CACHE_DIR:-/app/data/cache}"
    volumes:
      - subhub-cache:/app/data

volumes:
  subhub-cache:
