name = "mysub"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
REPO_BASE_URL = "https://raw.githubusercontent.com/monlor/subconverter-rules/main/"
SUB_CACHE_TTL = "3600"

# KV namespace for caching (subscriptions, rulesets, config files)
# Create with: npx wrangler kv namespace create "CACHE"
# Then fill in the returned id below.
[[kv_namespaces]]
binding = "CACHE"
id = "1e686b94c7b94e83ab1deca347347ded"

# Custom domain binding (requires monlor.com on same Cloudflare account)
[[routes]]
pattern = "mysub.monlor.com"
custom_domain = true

# Configure secrets via `wrangler secret put`:
#   SECRET_KEY      - authentication key for ?key= URL parameter
#   PROXY_SUBS      - comma-separated proxy subscription URLs (for /sub merging)
#   RELAY_SUBS      - comma-separated relay subscription URLs (for /sub merging)
#   PROXY_SUB_URL   - single proxy subscription URL for Surge/Clash provider (defaults to first of PROXY_SUBS)
#   RELAY_SUB_URL   - single relay subscription URL for Surge/Clash provider (defaults to first of RELAY_SUBS)
#   SURGE_INTERFACE - optional default egress interface for Surge (e.g. en0)
